name: pathaid-local-dev

# Docker is an optional development convenience. The product runtime is native
# macOS; no PostgreSQL, reverse proxy, or public ingress is required.
services:
  migrate:
    build:
      context: backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      PATHAID_DATA_DIR: /data
      PATHAID_DATABASE_PATH: /data/pathaid.sqlite3
      PATHAID_WEB_ORIGIN: http://127.0.0.1:3000
      PATHAID_EXTENSION_ID: ${PATHAID_EXTENSION_ID:-}
    volumes:
      - pathaid-local-data:/data
    restart: "no"

  api:
    build:
      context: backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - pathaid-local-data:/data
    ports:
      - "127.0.0.1:${PATHAID_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        PATHAID_API_URL: http://api:8000
    environment:
      PATHAID_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PATHAID_WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pathaid-local-data:
