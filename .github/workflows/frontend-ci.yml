name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "extension/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "extension/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify native standalone frontend runtime
        run: |
          ../scripts/prepare_frontend_runtime
          HOSTNAME=127.0.0.1 PORT=3101 node .next/standalone/server.js > /tmp/pathaid-standalone-web.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3101/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/pathaid-standalone-web.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag pathaid-frontend:test .
