name: MVP Release Gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: SQLite, adapters, backup, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # `runner.temp` is not available while GitHub validates job-level env.
      # Each Ubuntu job runs in a fresh VM, so this path remains isolated.
      PATHAID_DATA_DIR: /tmp/fresh-pathaid-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate launcher syntax
        working-directory: ${{ github.workspace }}
        run: bash -n scripts/pathaid
      - name: Require one migration head
        run: test "$(alembic heads | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
      - name: Migrate a fresh app-data directory
        run: alembic upgrade head
      - name: Require models and migrations to agree
        run: alembic check
      - name: Run offline backend, adapter, backup, and security tests
        run: pytest -q
      - name: Verify an empty app-data directory end to end
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_fresh_install.py
      - name: Run retained quality evaluations
        run: python -m app.quality_report
      - name: Audit runtime Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend build and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  extension:
    name: Extension permissions, adapters, and no-submit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
