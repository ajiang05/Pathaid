name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".env.example"
      - "compose.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".env.example"
      - "compose.yaml"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Local SQLite foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PATHAID_DATA_DIR: ${{ runner.temp }}/pathaid-data
      PATHAID_DATABASE_PATH: ${{ runner.temp }}/pathaid-data/pathaid.sqlite3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Require one migration head
        run: |
          head_count="$(alembic heads | sed '/^[[:space:]]*$/d' | wc -l)"
          test "$head_count" -eq 1

      - name: Apply fresh SQLite migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Run backend tests
        run: pytest -q

      - name: Report retained offline quality measurements
        run: python -m app.quality_report

      - name: Build local development backend image
        run: docker build --tag pathaid-backend:test .

      - name: Validate optional development Compose
        working-directory: ${{ github.workspace }}
        run: docker compose config --quiet
